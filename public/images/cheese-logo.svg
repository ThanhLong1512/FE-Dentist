<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="cheeseBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>
    <linearGradient id="cheeseTooth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f0f9ff" />
    </linearGradient>
    <linearGradient id="cheeseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <linearGradient id="cheeseTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <filter id="cheeseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g filter="url(#cheeseShadow)">
    <rect x="4" y="6" width="48" height="48" rx="14" fill="url(#cheeseBadge)" />
    <!-- Stylized Smiling Tooth -->
    <path d="M28 17 C22 17, 17 21, 17 27 C17 31, 19 35, 21 39 C22 41, 23 43, 24 43 C25.5 43, 26 40, 26.5 37 C27 34, 29 34, 29.5 37 C30 40, 30.5 43, 32 43 C33 43, 34 41, 35 39 C37 35, 39 31, 39 27 C39 21, 34 17, 28 17 Z" fill="url(#cheeseTooth)" />
    <!-- Warm smile curve on tooth -->
    <path d="M23 28 Q28 34 33 28" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" />
    <!-- Cheerful Sparkle / Cheese Wink -->
    <polygon points="42,12 43.5,16 47.5,17.5 43.5,19 42,23 40.5,19 36.5,17.5 40.5,16" fill="url(#cheeseGold)" />
    <circle cx="21" cy="20" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Typography -->
  <g transform="translate(62, 0)">
    <text x="0" y="31" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="21" font-weight="850" letter-spacing="-0.03em" fill="url(#cheeseTextGrad)">CHEESE CLINIC</text>
    <text x="1" y="46" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.12em" fill="#64748b">DENTAL &amp; IMPLANT CENTER</text>
  </g>
</svg>
