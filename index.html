<!DOCTYPE html>
<html lang="vi" class="mdl-js">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>Cheese Clinic - Hệ Thống Nha Khoa Kỹ Thuật Cao</title>
    <meta
      name="description"
      content="Hệ thống nha khoa kỹ thuật cao hàng đầu với đội ngũ bác sĩ chuyên khoa giàu kinh nghiệm, trang thiết bị chuẩn quốc tế."
    />

    <!-- Early Theme Check to avoid flash of unstyled theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("isDarkMode");
          var isDark = stored !== null ? JSON.parse(stored) : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark-mode");
          else document.documentElement.classList.add("light-mode");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Performance: Preconnect & DNS-Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- LCP Hero Image Preload -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=440&h=480&q=70&fm=webp"
      fetchpriority="high"
    />

    <!-- Google Fonts with display=swap (Non-blocking) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
